<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1440px;
    overflow: hidden;
  }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #F6F3EE;
    color: #1C1A17;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* 配图占上方，文字在下方米白区。不压暗图、不叠字，两边都清楚 */
  .media {
    height: 760px;
    flex: none;
    background-size: cover;
    background-position: center;
    background-color: #E7E2DA;
  }

  .panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 84px 80px;
  }

  /* 封面文字居中而不是贴底。无配图时贴底会在上方留出三分之二的空白，
     在小红书的信息流里显得很虚 */
  .panel.cover { justify-content: center; }
  .panel.body { justify-content: center; }
  .panel.outro { justify-content: center; align-items: flex-start; gap: 40px; }

  .rule {
    width: 96px;
    height: 5px;
    background: #D8654A;
    margin-bottom: 40px;
    flex: none;
  }

  .text {
    white-space: pre-wrap;
    text-wrap: pretty;
  }

  .cover .text {
    font-size: 82px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .body .text {
    font-size: 44px;
    line-height: 1.82;
    font-weight: 400;
    letter-spacing: 0.005em;
  }

  .outro .lead {
    font-size: 46px;
    line-height: 1.6;
    color: #56504A;
    white-space: pre-wrap;
  }

  .outro .site {
    font-size: 68px;
    font-weight: 700;
    letter-spacing: -0.01em;
    border-bottom: 5px solid #D8654A;
    padding-bottom: 12px;
  }

  .outro .note {
    font-size: 38px;
    color: #56504A;
  }
</style>

{{BODY}}
